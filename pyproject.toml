[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aei-3gpp-kpi-validator"
version = "0.1.0"
description = "A dependency-light Python validator for real 3GPP-standard telecom KPIs (RSRP, RSRQ, SINR, handover quality, NB-IoT power) - cites the actual TS specs, and states plainly what it does not implement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "AID Edge Inc." }
]
keywords = ["telecom", "3gpp", "kpi", "rsrp", "rsrq", "sinr", "handover", "nb-iot", "validation", "5g", "lte"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dask = [
    "dask[dataframe]>=2023.1,<2027",
]
metrics = [
    "prometheus-client>=0.16,<1",
]
dev = [
    "pytest>=7.4,<10",
    "build>=1.0,<2",
    "twine>=5.0,<8",
    "dask[dataframe]>=2023.1,<2027",
    "prometheus-client>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/AIDEdgeInc-Lab/aei-3gpp-kpi-validator"
Repository = "https://github.com/AIDEdgeInc-Lab/aei-3gpp-kpi-validator"
Issues = "https://github.com/AIDEdgeInc-Lab/aei-3gpp-kpi-validator/issues"
Changelog = "https://github.com/AIDEdgeInc-Lab/aei-3gpp-kpi-validator/blob/main/CHANGELOG.md"
Security = "https://github.com/AIDEdgeInc-Lab/aei-3gpp-kpi-validator/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aei_3gpp_kpi_validator = ["py.typed", "config/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
