name: CI

# Test matrix, build, `twine check --strict`, wheel hygiene, clean-venv install + import, dependency audit: shared with the
# other AID Edge libraries via AIDEdgeInc-Lab/.github (standards/ENGINEERING-QUALITY-STANDARD.md, Stage A/B for libraries).
# The reusable workflow is pinned to a full commit SHA; Dependabot (github-actions) keeps it current.
# Required check for branch protection: `ci-gate`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: AIDEdgeInc-Lab/.github/.github/workflows/reusable-python-lib-ci.yml@b98a66fe6b2d73292495a23cbbe861e108d87804
    with:
      import-name: aei_3gpp_kpi_validator
      python-versions: '["3.9","3.10","3.11","3.12"]'

  # Project-specific lane (not shared): the package must work with only its hard dependencies installed.
  test-without-optional-extras:
    name: Test with only hard dependencies (no Dask, no Prometheus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package with only hard runtime dependencies + pytest
        run: pip install -e . pytest
      - name: Run test suite, skipping tests that need optional extras
        run: pytest -v --ignore=tests/test_metrics_adapter.py

  ci-gate:
    if: ${{ always() }}
    needs: [ci, test-without-optional-extras]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required lanes must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          print({k: v['result'] for k, v in needs.items()})
          sys.exit(0 if all(v['result'] == 'success' for v in needs.values()) else 1)"
